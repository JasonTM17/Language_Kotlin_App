name: backend-ci

# Paths-scoped so an Android-only change does not run the backend suite, and
# vice versa. The two Gradle builds are independent by design — see ADR-0003.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle between runs. Without this every run re-downloads the
      # whole dependency graph.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keep the backend's static-analysis gate explicit and fail-fast. The
      # build below also includes check, so a lint regression cannot be hidden
      # behind a passing test-only step.
      - name: Static analysis
        run: ./gradlew detekt ktlintCheck --no-daemon

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Test reports are only useful when the run fails, so upload on failure.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: server/build/reports/tests/test
          retention-days: 7

  docker-publish:
    name: Build & Publish Container
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/linguaai-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
