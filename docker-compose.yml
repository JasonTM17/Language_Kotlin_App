# LinguaAI backend + MySQL + Qdrant.
#
#   cp .env.example .env    # fill in JWT_SECRET at minimum
#   docker-compose up --build
#
# The backend waits for MySQL to report healthy rather than for the container to
# merely exist: MySQL accepts a TCP connection well before it can serve queries,
# and starting against it produces a confusing "connection refused" crash loop.
#
# Qdrant is the vector engine for RAG retrieval. Set QDRANT_URL=http://qdrant:6333
# to route the knowledge index through it; leave it empty to keep the built-in
# SQL store (see docs/architecture ADR-007 for the trade-off).

services:
  mysql:
    image: mysql:8.0
    container_name: linguaai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-linguaai}
      MYSQL_USER: ${DB_USER:-linguaai}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # mysqladmin ping only returns success once the server is actually serving.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: linguaai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build:
      context: ./server
    container_name: linguaai-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-linguaai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: ${DB_USER:-linguaai}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_ACCESS_TOKEN_EXPIRY_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRY_DAYS: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-14}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_AUTO_INDEX: ${RAG_AUTO_INDEX:-true}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      QDRANT_URL: ${QDRANT_URL:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-linguaai_knowledge}
      # Dev default only: APP_ENV=production refuses to boot without a real token.
      OPS_TOKEN: ${OPS_TOKEN:-linguaai-dev-ops-token}
      RUN_MIGRATIONS: "true"
      SERVER_PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${SERVER_PORT:-8080}:8080"

volumes:
  mysql-data:
  qdrant-data:
